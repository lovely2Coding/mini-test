<title>ข้อสอบจำลอง AI Excel Notion</title>

<style>
/* Layout: single reading column; home is an index of exam sets, quiz is one question per screen with a numbered navigator. */
:root {
  --bg: #F3F6F5;
  --surface: #FFFFFF;
  --ink: #12201E;
  --muted: #55686A;
  --line: #D5E0DE;
  --accent: #0B6E66;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFEC;
  --good: #17703F;
  --good-soft: #DDF2E5;
  --bad: #B3261E;
  --bad-soft: #FBE3E0;
  --warn: #8A5200;
  --warn-soft: #FAEBCB;
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --font-display: "Prompt", "IBM Plex Sans Thai", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1615; --surface: #152120; --ink: #E5EFED; --muted: #93A9A6; --line: #27403D;
    --accent: #4FC3B7; --accent-ink: #06201D; --accent-soft: #163330;
    --good: #5BD18B; --good-soft: #12331F; --bad: #FF8F84; --bad-soft: #3B1A16;
    --warn: #F2B84B; --warn-soft: #382A0D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1615; --surface: #152120; --ink: #E5EFED; --muted: #93A9A6; --line: #27403D;
  --accent: #4FC3B7; --accent-ink: #06201D; --accent-soft: #163330;
  --good: #5BD18B; --good-soft: #12331F; --bad: #FF8F84; --bad-soft: #3B1A16;
  --warn: #F2B84B; --warn-soft: #382A0D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.65;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.3; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* home */
.top { display: grid; gap: 6px; margin-bottom: 24px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; color: var(--accent); font-weight: 600; text-transform: uppercase; }
.top h1 { font-size: clamp(30px, 7vw, 42px); }
.lede { color: var(--muted); }
.opts { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
.opts fieldset { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; min-width: 0; }
.opts legend { font-size: 13px; color: var(--muted); padding: 0; margin-bottom: 8px; font-weight: 500; }
.seg { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; min-width: 0; }
.seg:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.seg input { margin-top: 6px; accent-color: var(--accent); }
.seg b { display: block; font-weight: 600; }
.seg small { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.check { display: flex; gap: 10px; align-items: center; cursor: pointer; }
.check input { accent-color: var(--accent); width: 18px; height: 18px; }
.sets { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 10px; }
.set { width: 100%; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.set:hover { border-color: var(--accent); }
.set .num { font-family: var(--font-display); font-weight: 600; font-size: 20px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
.set .body { display: grid; gap: 2px; min-width: 0; }
.tag { font-size: 12.5px; font-weight: 600; color: var(--accent); letter-spacing: .04em; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.go { font-weight: 600; color: var(--accent); font-size: 14px; }
.btn { border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 11px 20px; font-weight: 600; }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.block { width: 100%; }
.note { margin-top: 16px; font-size: 13.5px; color: var(--muted); background: var(--warn-soft); border-radius: 10px; padding: 12px 14px; color: var(--warn); }

/* quiz */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.bar .ttl { min-width: 0; display: grid; }
.bar .ttl small { color: var(--muted); font-size: 13px; }
.bar .ttl b { font-weight: 600; overflow-wrap: anywhere; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px 4px; font-size: 14px; }
.prog { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 18px; }
.prog i { display: block; height: 100%; background: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; }
.qno { font-size: 13px; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.qtext { font-size: 18px; font-weight: 600; line-height: 1.55; overflow-wrap: anywhere; }
.choices { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .key { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt .txt { overflow-wrap: anywhere; padding-top: 1px; }
.opt.picked { border-color: var(--accent); background: var(--accent-soft); }
.opt.picked .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.correct .key { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt:disabled { cursor: default; color: var(--ink); }
.fb { border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; background: var(--accent-soft); }
.fb.ok { background: var(--good-soft); }
.fb.no { background: var(--bad-soft); }
.fb .h { font-weight: 600; }
.fb.ok .h { color: var(--good); }
.fb.no .h { color: var(--bad); }
.fb p { font-size: 15px; }
.flag { margin-top: 4px; font-size: 14px; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 10px; }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
.navi { margin-top: 18px; display: grid; gap: 10px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.chip { height: 38px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; padding: 0; }
.chip.answered { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.chip.no { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.chip.cur { box-shadow: 0 0 0 2px var(--ink); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
caption { text-align: left; font-size: 12.5px; color: var(--muted); padding: 8px 10px 0; caption-side: top; }
th, td { padding: 6px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
thead th { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
tr.g td { font-weight: 600; background: var(--bg); }
tr.t td { font-weight: 600; background: var(--accent-soft); border-bottom: 0; }
td.ind { padding-left: 28px; }
td.hl, th.hl { box-shadow: inset 2px 0 0 var(--bad), inset -2px 0 0 var(--bad); }

/* result */
.score { display: grid; gap: 6px; justify-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; margin-bottom: 18px; }
.score .big { font-family: var(--font-display); font-weight: 600; font-size: clamp(44px, 12vw, 64px); line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--accent); }
.score .big small { font-size: .42em; color: var(--muted); font-weight: 500; }
.score .pct { color: var(--muted); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.tabs { display: flex; gap: 8px; margin: 22px 0 12px; }
.tab { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; }
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rv { display: grid; gap: 12px; }
.ri { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.ri.ok { border-left-color: var(--good); }
.ri.no { border-left-color: var(--bad); }
.ri.skip { border-left-color: var(--warn); }
.ri .st { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ri.ok .st { color: var(--good); }
.ri.no .st { color: var(--bad); }
.ri.skip .st { color: var(--warn); }
.ri .q { font-weight: 600; overflow-wrap: anywhere; }
.ri .a { font-size: 15px; overflow-wrap: anywhere; }
.ri .a b { font-weight: 600; }
.ri .a.you { color: var(--bad); }
.ri .a.right { color: var(--good); }
.ri .w { font-size: 14.5px; color: var(--muted); }

/* modal */
#modal { position: fixed; inset: 0; background: rgba(8, 16, 15, .55); display: grid; place-items: center; padding: 16px; z-index: 20; }
#modal .box { background: var(--surface); border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; display: grid; gap: 16px; border: 1px solid var(--line); }
#modal .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

@media (max-width: 480px) {
  .card { padding: 16px; }
  .set { grid-template-columns: auto minmax(0, 1fr); }
  .set .go { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .prog i { transition: width .25s ease; }
  .opt, .chip, .set { transition: border-color .12s ease, background-color .12s ease; }
}
</style>

  var ALL = [];

  function bestMap() {
    try { return JSON.parse(localStorage.getItem('mockexam-best') || '{}'); } catch (e) { return {}; }
  }
  function saveBest(k, p) {
    try {
      var b = bestMap();
      if (!(b[k] >= p)) { b[k] = p; localStorage.setItem('mockexam-best', JSON.stringify(b)); }
    } catch (e) {}
  }
  function ask(msg, yes, cb) {
    document.getElementById('mtext').textContent = msg;
    document.getElementById('myes').textContent = yes;
    onYes = cb;
    modal.hidden = false;
    document.getElementById('myes').focus();
  }
  document.getElementById('mno').addEventListener('click', function () { modal.hidden = true; onYes = null; });
  document.getElementById('myes').addEventListener('click', function () {
    modal.hidden = true;
    var f = onYes; onYes = null;
    if (f) f();
  });

  function shuf(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function top() { try { window.scrollTo(0, 0); } catch (e) {} }

  function tbl(k) {
    var t = TABLES[k];
    if (!t) return '';
    var h = '<div class="tbl-wrap"><table><caption>' + esc(t.cap) + '</caption><thead><tr>';
    t.head.forEach(function (c, i) { h += '<th' + (t.hl === i ? ' class="hl"' : '') + '>' + esc(c) + '</th>'; });
    h += '</tr></thead><tbody>';
    t.rows.forEach(function (r) {
      var kind = r.length > t.head.length ? r[r.length - 1] : '';
      h += '<tr' + (kind ? ' class="' + kind + '"' : '') + '>';
      for (var i = 0; i < t.head.length; i++) {
        var cls = [];
        if (i === 0 && !kind && k === 'p10') cls.push('ind');
        if (t.hl === i) cls.push('hl');
        h += '<td' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '>' + esc(r[i]) + '</td>';
      }
      h += '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  function begin(title, key, list) {

      var ord = [0, 1, 2, 3];

      return { q: q, order: ord, pick: null };
    });
    S.sess = { title: title, key: key, items: items, idx: 0, mode: S.mode, done: false };
    quiz();
  }

      var cls = 'opt';
      if (locked) { if (oi === q.a) cls += ' correct'; else if (it.pick === oi) cls += ' wrong'; }
      else if (it.pick === oi) cls += ' picked';

        '<span class="key">' + (pos + 1) + '</span><span class="txt">' + esc(q.o[oi]) + '</span></button>';
    }).join('');

        (q.f ? '<p class="flag"><b>ควรตรวจซ้ำ:</b> ' + esc(q.f) + '</p>' : '') + '</div>';
    }
    var chips = s.items.map(function (x, i) {
      var c = 'chip';
      if (prac && x.pick !== null) c += x.pick === x.q.a ? ' ok' : ' no';
      else if (x.pick !== null) c += ' answered';
      if (i === s.idx) c += ' cur';
      return '<button type="button" class="' + c + '" data-act="go" data-i="' + i + '" aria-label="ไปข้อ ' + (i + 1) + '"' + (i === s.idx ? ' aria-current="step"' : '') + '>' + (i + 1) + '</button>';
    }).join('');
    var last = s.idx === n - 1;
    var setTag = SETS[q.si];
    app.innerHTML =
      '<div class="bar"><div class="ttl"><small>' + esc(s.title) + '</small><b>' + esc(setTag.tag) + '</b></div>' +
      '<button class="linkbtn" type="button" data-act="exit">ออกจากข้อสอบ</button></div>' +
      '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + (s.idx + 1) + '"><i style="width:' + Math.round(((s.idx + 1) / n) * 100) + '%"></i></div>' +
      '<section class="card" role="radiogroup" aria-label="ข้อ ' + (s.idx + 1) + '"><p class="qno">ข้อ ' + (s.idx + 1) + ' / ' + n + '</p>' +
      '<h2 class="qtext">' + esc(q.q) + '</h2>' + (q.t ? tbl(q.t) : '') + '<div class="choices">' + choices + '</div>' + fb + '</section>' +
      '<div class="nav"><button class="btn ghost" type="button" data-act="prev"' + (s.idx === 0 ? ' disabled' : '') + '>ก่อนหน้า</button>' +
      (last ? '<button class="btn" type="button" data-act="finish">ส่งคำตอบ</button>' : '<button class="btn" type="button" data-act="next">ถัดไป</button>') + '</div>' +
      '<div class="navi"><div class="chips">' + chips + '</div>' +
      (last ? '' : '<div><button class="linkbtn" type="button" data-act="finish">ส่งคำตอบตอนนี้</button></div>') + '</div>';
    top();
  }

  function finish() {
    var s = S.sess;
    var left = s.items.filter(function (x) { return x.pick === null; }).length;
    var go = function () { s.done = true; S.filter = 'all'; result(); };
    if (left > 0) ask('ยังมี ' + left + ' ข้อที่ไม่ได้ตอบ ต้องการส่งคำตอบเลยหรือไม่?', 'ส่งคำตอบ', go);
    else go();
  }

  function result() {
    var s = S.sess, n = s.items.length;
    var right = s.items.filter(function (x) { return x.pick === x.q.a; }).length;
    var pct = Math.round((right / n) * 100);
    if (s.key) saveBest(s.key, pct);
    var wrongRefs = s.items.filter(function (x) { return x.pick !== x.q.a; }).map(function (x) { return x.q; });
    var msg = pct >= 80 ? 'แม่นมาก' : (pct >= 60 ? 'ดี ทบทวนข้อที่พลาดอีกนิด' : 'ลองทบทวนข้อที่พลาดแล้วทำใหม่');
    var list = s.items.map(function (x, i) { return { x: x, i: i }; }).filter(function (r) {
      return S.filter === 'all' ? true : r.x.pick !== r.x.q.a;
    });
    var rv = list.map(function (r) {
      var x = r.x, q = x.q;
      var st = x.pick === null ? 'skip' : (x.pick === q.a ? 'ok' : 'no');
      var stTxt = st === 'ok' ? 'ข้อ ' + (r.i + 1) + ' ถูก' : (st === 'no' ? 'ข้อ ' + (r.i + 1) + ' ผิด' : 'ข้อ ' + (r.i + 1) + ' ไม่ได้ตอบ');
      var h = '<article class="ri ' + st + '"><span class="st">' + stTxt + ' · ' + esc(SETS[q.si].tag) + '</span><p class="q">' + esc(q.q) + '</p>' + (q.t ? tbl(q.t) : '');
      if (st === 'no') h += '<p class="a you"><b>คำตอบของคุณ:</b> ' + esc(q.o[x.pick]) + '</p>';
      h += '<p class="a right"><b>เฉลย:</b> ' + esc(q.o[q.a]) + '</p><p class="w">' + esc(q.w) + '</p>' +
        (q.f ? '<p class="flag"><b>ควรตรวจซ้ำ:</b> ' + esc(q.f) + '</p>' : '') + '</article>';
      return h;
    }).join('');
    if (!rv) rv = '<p class="lede">ตอบถูกทุกข้อ ไม่มีข้อที่ต้องทบทวน</p>';
    app.innerHTML =
      '<header class="top"><p class="eyebrow">ผลการสอบ</p><h1>' + esc(s.title) + '</h1></header>' +
      '<section class="score"><div class="big">' + right + '<small> / ' + n + ' ข้อ</small></div><p class="pct">' + pct + '% · ' + msg + '</p>' +
      '<div class="actions"><button class="btn" type="button" data-act="retry">ทำใหม่ทั้งชุด</button>' +
      (wrongRefs.length ? '<button class="btn ghost" type="button" data-act="retry-wrong">ทำเฉพาะข้อที่ผิด (' + wrongRefs.length + ')</button>' : '') +
      '<button class="btn ghost" type="button" data-act="home">กลับหน้าหลัก</button></div></section>' +
      '<h2>ทบทวนรายข้อ</h2><div class="tabs" role="group" aria-label="กรองรายการ">' +
      '<button class="tab" type="button" data-act="filter" data-f="all" aria-pressed="' + (S.filter === 'all') + '">ทั้งหมด (' + n + ')</button>' +
      '<button class="tab" type="button" data-act="filter" data-f="wrong" aria-pressed="' + (S.filter === 'wrong') + '">ผิดหรือไม่ได้ตอบ (' + wrongRefs.length + ')</button></div>' +
      '<div class="rv">' + rv + '</div>';
    top();
  }

  app.addEventListener('change', function (e) {
    if (e.target.name === 'mode') S.mode = e.target.value;
    if (e.target.id === 'shuffle') S.shuffle = e.target.checked;
  });

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var a = el.getAttribute('data-act'), s = S.sess;
    if (a === 'start') {
      var i = +el.getAttribute('data-set');
      begin(SETS[i].title, SETS[i].key, SETS[i].qs);
    } else if (a === 'start-all') {
      begin('สอบรวมทุกชุด ' + TOTAL + ' ข้อ', 'all', ALL);
    } else if (a === 'pick') {
      var it = s.items[s.idx];
      if (s.mode === 'practice' && it.pick !== null) return;
      it.pick = +el.getAttribute('data-oi');
      quiz();
    } else if (a === 'next') { if (s.idx < s.items.length - 1) { s.idx++; quiz(); } }
    else if (a === 'prev') { if (s.idx > 0) { s.idx--; quiz(); } }
    else if (a === 'go') { s.idx = +el.getAttribute('data-i'); quiz(); }
    else if (a === 'finish') finish();
    else if (a === 'exit') {
      var started = s.items.some(function (x) { return x.pick !== null; });
      if (started) ask('ออกจากข้อสอบ? คำตอบที่ทำไว้จะหายไป', 'ออก', home); else home();
    } else if (a === 'home') home();
    else if (a === 'retry') {
      begin(s.title, s.key, s.items.map(function (x) { return x.q; }));
    } else if (a === 'retry-wrong') {
      var w = s.items.filter(function (x) { return x.pick !== x.q.a; }).map(function (x) { return x.q; });
      begin('ทบทวนข้อที่ผิด · ' + s.title, null, w);
    } else if (a === 'filter') {
      S.filter = el.getAttribute('data-f');
      result();
    }
  });

  document.addEventListener('keydown', function (e) {
    var s = S.sess;
    if (!s || s.done || !modal.hidden) return;
    var tg = e.target && e.target.tagName;
    if (tg === 'INPUT' || tg === 'TEXTAREA') return;
    if (e.key >= '1' && e.key <= '4') {
      var it = s.items[s.idx];
      if (s.mode === 'practice' && it.pick !== null) return;
      it.pick = it.order[+e.key - 1];
      quiz();
    } else if (e.key === 'ArrowRight' && s.idx < s.items.length - 1) { s.idx++; quiz(); }
    else if (e.key === 'ArrowLeft' && s.idx > 0) { s.idx--; quiz(); }
  });

  home();
})();
</script>

</body></html>
