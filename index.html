<style>

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}

button{font:inherit;cursor:pointer}

details.palette{margin:6px 0 14px;background:var(--sheet);border:1px solid var(--line);border-radius:8px}

.stim .pl{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}

.qs{display:flex;flex-direction:column;gap:12px;min-width:0}

.q.is-right{border-color:var(--ok)}

.q-top{display:flex;gap:10px;align-items:baseline}
.qn{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--accent);min-width:26px}
.qt{font-family:var(--body);font-size:15.5px;line-height:1.6;min-width:0}
.qt .gap{display:inline-block;min-width:64px;border-bottom:1.5px solid var(--ink);margin:0 2px}

.opt:hover{border-color:var(--accent)}

.ex b{font-family:var(--ui)}

.navrow{display:flex;justify-content:space-between;gap:10px;padding-block:8px 40px;flex-wrap:wrap}

/* in-page confirm */
.sheet-overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);display:grid;place-items:center;z-index:20;padding:16px}
.dialog{background:var(--sheet);color:var(--ink);border-radius:12px;max-width:420px;width:100%;padding:20px;border:1px solid var(--line)}
.dialog h3{margin:0 0 6px;font-family:var(--display)}
.dialog p{margin:0 0 16px;font-family:var(--th);color:var(--muted)}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* results */
.result{padding-block:24px 8px}
.score-card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.big{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--muted);font-weight:600}
.pct{font-family:var(--mono);color:var(--muted);margin-top:4px}
.bars{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13.5px}

.brow .track i{display:block;height:100%;background:var(--accent)}
.brow .track i.weak{background:var(--bad)}
.brow b{font-family:var(--mono);font-weight:600;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.result-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.result-actions label{font-family:var(--th);font-size:14px;display:flex;gap:6px;align-items:center;color:var(--muted)}
.tip{font-family:var(--th);color:var(--muted);font-size:14px;margin:12px 0 0}

<script>
/* ---------- EXAM DATA ---------- */
/* In every question, opts[0] is the correct answer; options are shuffled on screen unless fixed:true. */
const CHART_SVG = (() => {
  const data=[[2018,20],[2019,40],[2020,10],[2021,10],[2022,30],[2023,50],[2024,60]];
  const W=520,H=280,L=52,R=16,T=20,B=44, max=70;
  const x=i=>L+i*(W-L-R)/(data.length-1), y=v=>T+(H-T-B)*(1-v/max);
  let g='';
  for(let v=0;v<=70;v+=10){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`}
  const pts=data.map((d,i)=>`${x(i)},${y(d[1])}`).join(' ');
  let dots='',labels='';
  data.forEach((d,i)=>{dots+=`<circle cx="${x(i)}" cy="${y(d[1])}" r="4" fill="var(--accent)"/>`;
    labels+=`<text x="${x(i)}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${d[0]}</text>`;
    labels+=`<text x="${x(i)}" y="${y(d[1])-9}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${d[1]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line graph of visitors to Green Bay Marine Park from 2018 to 2024, in thousands: 2018 20, 2019 40, 2020 10, 2021 10, 2022 30, 2023 50, 2024 60.">
  ${g}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}
  <text x="14" y="${(H-B+T)/2}" transform="rotate(-90 14 ${(H-B+T)/2})" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Familjen Grotesk, sans-serif">Visitors (thousands)</text>
  <text x="${(W+L)/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Familjen Grotesk, sans-serif">Year</text></svg>`;
})();

let EXAM;
const SET_A = [
{ id:"p1", tab:"Part I", title:"Part I · Vocabulary", sub:"Choose the best alternative to complete the sentence. (15 items)",
  groups:[{ title:"Units 3–5 key words", qs:[
  {t:"V", q:"The concert was ___ only ten minutes after the tickets went on sale, so many fans could not get a seat.", opts:["sold-out","devoted","accepting","common"], ex:"<b>sold-out</b> (adj) = ตั๋วขายหมดก่อนการแสดงเริ่ม (Unit 3)"},
  {t:"V", q:"Last year, the singer ___ one million dollars to a children's hospital.", opts:["donated","dominated","ignored","deserved"], ex:"<b>donate</b> = บริจาคเงินหรือสิ่งของเพื่อช่วยเหลือ (Unit 3)"},
  {t:"V", q:"Her fans are so ___ to her that they wait outside her hotel for hours just to say hello.", opts:["devoted","potential","stable","severe"], ex:"<b>devoted (to)</b> = ทุ่มเท รักและภักดีอย่างมาก (Unit 3)"},
  {t:"V", q:"For many years, Hollywood movies ___ cinemas around the world, but today audiences watch films from many countries.", opts:["dominated","donated","released","restored"], ex:"<b>dominate</b> = เป็นส่วนที่ใหญ่ที่สุด/ครองพื้นที่ (Unit 3)"},
  {t:"V", q:"The film ___ wrote a harsh review, saying the story was boring and far too long.", opts:["critic","consumer","brand","festival"], ex:"<b>critic</b> = ผู้วิจารณ์ คนที่แสดงความไม่ชอบต่อบางสิ่ง (Unit 3)"},
  {t:"V", q:"Nike and Adidas are two of the most famous sports ___ in the world.", opts:["brands","critics","societies","interviews"], ex:"<b>brand</b> = ตราสินค้า ชื่อบริษัทหรือสินค้า (Unit 3)"},
  {t:"V", q:"Scientists ___ that about 90 percent of large ocean fish have disappeared, but no one knows the exact number.", opts:["estimate","restore","survive","harvest"], ex:"<b>estimate</b> = ประมาณการจากข้อมูลที่มี — คำใบ้คือ “no one knows the exact number” (Unit 4)"},
  {t:"V", q:"Without enough food, many young sea turtles cannot ___ their first year of life.", opts:["survive","reduce","double","rely"], ex:"<b>survive</b> = รอดชีวิต (Unit 4)"},
  {t:"V", q:"Millions of people in coastal villages ___ fishing for both food and income.", opts:["rely on","take on","build on","move on"], ex:"<b>rely on</b> = พึ่งพา — ส่วน take on = รับงานเพิ่ม, build on = ต่อยอดความสำเร็จ, move on = ก้าวหน้า/ทันสมัยขึ้น (Unit 4 Word Partners)"},

  {t:"V", q:"The number of wild tigers has been ___ for decades because their forests are being cut down.", opts:["declining","doubling","informed","diverse"], ex:"<b>declining</b> = ลดลงเรื่อย ๆ — เหตุผลคือป่าถูกตัด จำนวนจึงลด ไม่ใช่เพิ่ม (Unit 4)"},
  {t:"V", q:"AJ can ___ minor details, such as what she ate for lunch on a particular day twenty years ago.", opts:["recall","transfer","donate","ignore"], ex:"<b>recall</b> = จำได้ นึกออก (Unit 5)"},
  {t:"V", q:"Headaches, a sore throat, and a high fever are common ___ of the flu.", opts:["symptoms","routes","cycles","proofs"], ex:"<b>symptom</b> = อาการที่บ่งบอกว่าร่างกายหรือจิตใจผิดปกติ (Unit 5)"},
  {t:"V", q:"Doing a ___ activity, such as a crossword puzzle, is good exercise for your brain.", opts:["mental","physical","medical","extreme"], ex:"<b>mental</b> = เกี่ยวกับจิตใจ/การใช้สมอง ต่างจาก physical ที่ใช้ร่างกาย (Unit 5)"},
  {t:"V", q:"The police could not arrest the man because they had no ___ that he took the money.", opts:["proof","stress","approach","state"], ex:"<b>proof</b> = หลักฐานที่แสดงว่าบางสิ่งเป็นจริง (Unit 5)"}
  ]}]
},
{ id:"p2", tab:"Part II", title:"Part II · Reading Comprehension", sub:"Read three unseen passages and answer the questions. (15 items)",
  groups:[
  { title:"Passage 1 · Going global", stim:`<h3>From Taipei to the World: The Bubble Tea Boom</h3>
<p><span class="pl">1</span>Bubble tea, also called boba or pearl milk tea, started in Taiwan in the 1980s. It is usually made with black tea, milk, sugar, and small chewy balls made from tapioca. At first, it was a cheap drink that students bought from small stalls after school. Few people outside Taiwan had heard of it.</p>
<p><span class="pl">2</span>Since then, bubble tea has spread across the globe. In the 1990s, Taiwanese people who moved to the United States, Canada, and Australia opened the first bubble tea shops abroad. Their customers were mostly Asian students who missed the taste of home. However, social media changed everything. Because the drink is colorful and looks good in photos, young people began posting pictures of it online, and soon everyone wanted to try it.</p>
<p><span class="pl">3</span>Today, large bubble tea chains have thousands of stores in dozens of countries. Shops now offer hundreds of flavors, from mango to cheese foam, so customers can create a drink that matches their own taste. Some companies have even introduced healthier versions with less sugar because many consumers are worried about their diet.</p>
<p><span class="pl">4</span>Not everyone is a fan, though. Some doctors warn that a large cup can contain as much sugar as a can of soda, or even more. Still, the popularity of bubble tea shows no sign of declining. It is a good example of how a simple local drink can become a global trend.</p>`,
    qs:[
    {t:"R", q:"What is the passage mainly about?", opts:["how bubble tea grew from a local drink into a global trend","how to make bubble tea at home","why doctors say bubble tea is unhealthy","the differences between bubble tea and soda"], ex:"ใจความหลักอยู่ที่ประโยคสุดท้าย: “how a simple local drink can become a global trend” ส่วนตัวเลือกอื่นเป็นแค่รายละเอียดย่อย"},
    {t:"R", q:"According to paragraph 2, who were the first customers of bubble tea shops outside Taiwan?", opts:["Asian students who missed the taste of home","American office workers","doctors and health experts","tourists visiting Taiwan"], ex:"ย่อหน้า 2: “Their customers were mostly Asian students who missed the taste of home.”"},
    {t:"R", q:"Why did social media help bubble tea become popular?", opts:["The drink is colorful and looks good in photos.","Shops gave free drinks to people who posted online.","Famous singers advertised it on TV.","It was cheaper than other drinks sold online."], ex:"ย่อหน้า 2 ใช้ <b>because</b> บอกเหตุผล: “Because the drink is colorful and looks good in photos…”"},
    {t:"R", q:"In paragraph 1, the word “it” in “Few people outside Taiwan had heard of <u>it</u>” refers to ___.", opts:["bubble tea","Taiwan","school","a small stall"], ex:"it แทนสิ่งที่พูดถึงตลอดย่อหน้า คือ bubble tea (เครื่องดื่ม) ไม่ใช่สถานที่"},

  { title:"Passage 2 · Saving our seas", stim:`<h3>Rainforests of the Sea</h3>
<p><span class="pl">1</span>Coral reefs cover less than one percent of the ocean floor, but they are home to about 25 percent of all marine species. For this reason, scientists often call them the “rainforests of the sea.” Reefs also protect coastlines from storms and provide food and jobs for millions of people.</p>
<p><span class="pl">2</span>Unfortunately, coral reefs around the world are in serious danger. The biggest threat is rising ocean temperatures. When the water becomes too warm, corals push out the tiny algae that live inside them and give them their color. As a result, the corals turn white. This process is called coral bleaching. If the water does not cool down quickly, the corals may die.</p>
<p><span class="pl">3</span>Other human activities are also harming reefs. Pollution from farms and cities flows into the sea, and some fishermen use harmful methods like dynamite fishing, which destroys large areas of coral at once. Scientists estimate that the world has lost about half of its coral reefs since the 1950s.</p>
<p><span class="pl">4</span>However, there is still hope. In some countries, governments have created marine protected areas where fishing is limited. Scientists are also growing coral in underwater “nurseries” and transferring it to damaged reefs. Individuals can help, too, by reducing their use of plastic and choosing sunscreen that is safe for reefs. If we act now, we may be able to restore these beautiful ecosystems for future generations.</p>`,
    qs:[
    {t:"R", q:"Why are coral reefs called the “rainforests of the sea”?", opts:["They are home to a very large number of marine species.","They grow in warm, rainy places.","They cover most of the ocean floor.","They are green like the trees in a forest."], ex:"ย่อหน้า 1: เป็นที่อยู่ของสิ่งมีชีวิตทะเลราว 25% “For this reason…” ส่วน “cover most of the ocean floor” ผิด เพราะครอบคลุมไม่ถึง 1%"},
    {t:"R", q:"According to paragraph 2, what happens during coral bleaching?", opts:["Corals push out the algae living inside them and turn white.","Corals grow faster and become brighter.","Algae cover the corals and turn them green.","Fishermen paint the corals white."], ex:"ย่อหน้า 2: “corals push out the tiny algae… As a result, the corals turn white.”"},

  { title:"Passage 3 · Memory and learning", stim:`<h3>Put Your Notes Away</h3>
<p><span class="pl">1</span>Most students prepare for exams by reading their notes again and again. It feels like a good way to study: the more you read, the more familiar the information becomes. However, research in psychology suggests that this is not the most effective approach.</p>
<p><span class="pl">2</span>In one study, researchers divided students into groups. All the students read a short science text. One group then read the text three more times. Another group read it only once more and then took practice tests in which they had to recall as much information as possible without looking. One week later, both groups took a final test. The students who had practiced recalling the information remembered much more than the students who had only reread it.</p>
<p><span class="pl">3</span>Psychologists call this the “testing effect.” When you try to bring information back from memory, your brain has to work hard. This mental effort makes the memory stronger, so it is easier to find the next time you need it. Simply rereading, on the other hand, makes information feel familiar, but familiarity is not the same as real learning.</p>
<p><span class="pl">4</span>There are many easy ways to use the testing effect. You can make flashcards, answer the questions at the end of a textbook chapter, or explain a topic to a friend without looking at your notes. By testing yourself regularly, you can transfer information from short-term memory into long-term memory. The next time you have an exam, try putting your notes away and asking yourself questions instead.</p>`,
    qs:[
    {t:"R", q:"What is the main idea of the passage?", opts:["Testing yourself is a more effective way to remember information than rereading.","Students should read their notes as many times as possible.","Short-term memory is more important than long-term memory.","Flashcards are the only good way to study."], ex:"ทั้งบทความเปรียบเทียบการอ่านซ้ำกับการทดสอบตัวเอง และสรุปว่าการทดสอบตัวเองได้ผลกว่า"},
    {t:"R", q:"In the study, which students remembered the most after one week?", opts:["the students who practiced recalling the information","the students who read the text four times","the students who did not read the text","the students who took notes while reading"], ex:"ย่อหน้า 2: “The students who had practiced recalling the information remembered much more…”"},
    {t:"R", q:"According to paragraph 3, why does recalling information make a memory stronger?", opts:["The brain has to make a mental effort to find the information.","The information becomes more familiar.","It takes less time than rereading.","Tests are easier than textbooks."], ex:"“This mental effort makes the memory stronger” — ส่วน “familiar” คือผลของการอ่านซ้ำ ซึ่งบทความบอกว่าไม่ใช่การเรียนรู้จริง"},

/* ===== SET B · Challenge ===== */
function makeChart(data,max,step,yLabel,aria,pre){
  const W=520,H=280,L=56,R=16,T=22,B=44;
  const x=i=>L+i*(W-L-R)/(data.length-1), y=v=>T+(H-T-B)*(1-v/max);
  let g='';
  for(let v=0;v<=max;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${pre}${v}</text>`}
  const pts=data.map((d,i)=>`${x(i)},${y(d[1])}`).join(' ');
  let dots='',labels='';
  data.forEach((d,i)=>{dots+=`<circle cx="${x(i)}" cy="${y(d[1])}" r="4" fill="var(--accent)"/>`;
    labels+=`<text x="${x(i)}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${d[0]}</text>`;
    labels+=`<text x="${x(i)}" y="${y(d[1])-9}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${pre}${d[1]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">${g}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}
  <text x="14" y="${(H-B+T)/2}" transform="rotate(-90 14 ${(H-B+T)/2})" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Familjen Grotesk, sans-serif">${yLabel}</text>
  <text x="${(W+L)/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Familjen Grotesk, sans-serif">Year</text></svg>`;
}

  {t:"V", q:"The new phone was first ___ in only twelve countries, but it is now available almost everywhere.", opts:["released","donated","dominated","restored"], ex:"<b>release</b> = ทำให้มีวางจำหน่าย/เปิดตัว ตรงกับ “now available” ส่วน dominate = ครองตลาด ไม่เข้ากับ “in only twelve countries”"},
  {t:"V", q:"Young consumers expect fashion brands to be more ___ of people of every size, age, and skin color.", opts:["accepting","devoted","potential","common"], ex:"<b>accepting of</b> = ยอมรับ (Unit 3) ส่วน devoted ต้องใช้กับ to (devoted to) จึงผิดทั้งความหมายและบุพบท"},
  {t:"V", q:"When a company ___ complaints on social media, unhappy customers often share their anger with even more people.", opts:["ignores","deserves","dominates","estimates"], ex:"<b>ignore</b> = เพิกเฉย เป็นสาเหตุให้ลูกค้าโกรธมากขึ้น ตัวลวงอื่นไม่ทำให้เกิดผลนี้"},
  {t:"V", q:"Because the fish population is no longer ___, scientists cannot predict how many fish there will be next year.", opts:["stable","diverse","severe","essential"], ex:"<b>stable</b> = คงที่ ไม่เปลี่ยนแปลง ถ้าไม่คงที่ก็คาดการณ์ไม่ได้ ส่วน diverse = หลากหลาย ไม่เกี่ยวกับการคาดการณ์จำนวน"},
  {t:"V", q:"Before you choose which seafood to buy, learn the facts so that you can make an ___ decision.", opts:["informed","essential","individual","official"], ex:"<b>informed decision</b> = การตัดสินใจโดยรู้ข้อเท็จจริง ตรงกับ “learn the facts” ตัวลวง individual/essential เข้ากับ decision ได้ แต่ไม่เกี่ยวกับการหาข้อมูล"},
  {t:"V", q:"Overfishing has had such a ___ effect on bluefin tuna that some populations may never recover.", opts:["severe","stable","diverse","minor"], ex:"<b>severe</b> = รุนแรงมาก ตรงกับ “may never recover” ส่วน minor = เล็กน้อย ความหมายตรงข้าม"},
  {t:"V", q:"Many island communities ___ tourism, so when the visitors stopped coming, most families lost their income.", opts:["rely on","build on","take on","move on"], ex:"<b>rely on</b> = พึ่งพา ผลคือเมื่อไม่มีนักท่องเที่ยวก็ขาดรายได้ (Word Partners verb + on, Unit 4)"},
  {t:"V", q:"After her first film won an award, the young director hoped to ___ that success with an even bigger project.", opts:["build on","rely on","take on","move on"], ex:"<b>build on (success)</b> = ต่อยอดความสำเร็จ ส่วน take on = รับงานเพิ่ม ใช้กับ work ไม่ใช่ success"},
  {t:"V", q:"When she heard about the terrible accident, she was in a state of ___ and could not say a word.", opts:["shock","emergency","the art","memory"], ex:"<b>state of shock</b> = ตกใจอย่างรุนแรงจากเรื่องไม่คาดคิด ส่วน state of emergency ใช้กับรัฐบาลประกาศภาวะฉุกเฉิน"},
  {t:"V", q:"Before a race, many runners close their eyes and ___ themselves crossing the finish line in first place.", opts:["visualize","memorize","summarize","socialize"], ex:"<b>visualize</b> = นึกภาพในใจ (-ize, Unit 5) ส่วน memorize = ท่องจำ ใช้กับข้อมูล ไม่ใช่การจินตนาการภาพตัวเอง"},
  {t:"V", q:"Her ___ to studying is unusual: she learns new material only by teaching it to her classmates.", opts:["approach","route","cycle","symptom"], ex:"<b>approach to</b> = วิธีการ/แนวทาง ตัวลวง route ดูใกล้เคียงแต่หมายถึงเส้นทางเดินทางจริง"},
  {t:"V", q:"Losing his memory after the virus was ___, yet his daughter says he is now one of the happiest people she knows.", opts:["tragic","minor","memorable","medical"], ex:"<b>tragic</b> = น่าเศร้าอย่างยิ่ง คำว่า “yet” แสดงความขัดแย้งกับ “happiest” ส่วน memorable = น่าจดจำ ไม่สร้างความขัดแย้ง"},
  {t:"V", q:"Winning a gold medal at the Olympics was the greatest ___ of her sporting career.", opts:["achievement","achiever","achieving","achieved"], ex:"ช่องว่างหลัง “the greatest” ต้องเป็นคำนามที่หมายถึง “ผลของการกระทำ” → <b>achievement</b> (-ment) ส่วน achiever (-er) = คนที่ประสบความสำเร็จ"},
  {t:"V", q:"A ___ advisor helps people decide how to save, spend, and invest their money wisely.", opts:["financial","finance","financer","financially"], ex:"หน้าคำนาม advisor ต้องใช้คุณศัพท์ → <b>financial</b> (finance + -ial, Unit 4) ส่วน finance advisor ไม่ใช่รูปที่บทเรียนสอน"}
  ]}]
},
{ id:"p2", tab:"Part II", title:"Part II · Reading Comprehension", sub:"Read three unseen passages and answer the questions. (15 items)",
  groups:[
  { title:"Passage 1 · Going global", stim:`<h3>How Sushi Went Global</h3>
<p><span class="pl">1</span>Today you can buy sushi in supermarkets from Brazil to Norway. Yet sixty years ago, few people outside Japan had ever tried it. In fact, many people in Western countries found the idea of eating raw fish strange or even unpleasant.</p>
<p><span class="pl">2</span>Sushi's journey began in the United States in the 1960s, when a few Japanese restaurants in Los Angeles opened sushi bars. At first, their customers were mainly Japanese businesspeople working in the city. To attract local diners, some chefs began to experiment. The best-known result was the California roll, which uses avocado and cooked crab instead of raw fish and hides the seaweed on the inside. Because it looked and tasted less unfamiliar, it became a “first step” for many Americans.</p>
<p><span class="pl">3</span>Once sushi had become fashionable in America, it spread quickly to other countries, and chefs in each place adapted it to local tastes. In Brazil, for example, sushi is sometimes topped with tropical fruit, while in parts of Europe it is often served with cream cheese.</p>
<p><span class="pl">4</span>Not everyone welcomes these changes. Some traditional chefs in Japan feel that foreign versions have lost the simple balance that makes sushi special. Others argue that food has always changed as it travels, and that new versions bring more people to the original. Either way, sushi's success has had a serious side effect: global demand for tuna has contributed to overfishing, especially of bluefin tuna.</p>`,
    qs:[
    {t:"R", q:"What is the main purpose of paragraph 2?", opts:["to explain how sushi was changed to attract American diners","to show why Japanese businesspeople disliked local food","to describe how the California roll is prepared in Japan","to compare sushi bars in Los Angeles with those in Tokyo"], ex:"ย่อหน้า 2 เล่าว่าเชฟ “began to experiment” เพื่อ “attract local diners” จนเกิด California roll ตัวลวงอื่นหยิบคำในย่อหน้ามาใช้ แต่บทความไม่ได้พูดถึงเรื่องเหล่านั้น"},
    {t:"R", q:"According to the passage, why did the California roll become a “first step” for many Americans?", opts:["It seemed less strange to people who were new to sushi.","It was cheaper than the sushi in other Japanese restaurants.","It was the first kind of sushi to be served with raw fish.","It was created by famous American chefs in Los Angeles."], ex:"“Because it looked and tasted less unfamiliar” = ดูแปลกน้อยกว่า ส่วนเรื่องราคาและเชฟชาวอเมริกันไม่มีในบทความ และ California roll ไม่ใช้ปลาดิบ"},
    {t:"R", q:"Which statement is NOT TRUE according to the passage?", opts:["Sushi became fashionable in Europe before it reached the US.","Some sushi in Brazil is served with tropical fruit on top.","The first sushi customers in Los Angeles were mostly Japanese.","Many Westerners once thought that eating raw fish was unpleasant."], ex:"ย่อหน้า 3: “Once sushi had become fashionable in America, it spread… to other countries” แปลว่าดังในอเมริกาก่อนยุโรป ข้อแรกจึงไม่จริง"},
    {t:"R", q:"Why does the writer mention overfishing in paragraph 4?", opts:["to show that sushi's global success has had a negative result","to argue that traditional chefs should stop serving bluefin tuna","to explain why sushi is now more expensive than it was before","to prove that foreign versions of sushi are less healthy to eat"], ex:"“sushi's success has had a serious side effect” = ผลเสียของความสำเร็จ ผู้เขียนไม่ได้เสนอให้หยุดขายทูน่าหรือพูดถึงราคา/สุขภาพ"},
    {t:"R", q:"The “others” in paragraph 4 would most likely agree with which statement?", opts:["Changing a dish can help more people discover the original.","Foreign sushi has lost the balance that makes sushi special.","Sushi should only be prepared by chefs who trained in Japan.","Local versions of sushi are a serious threat to Japanese culture."], ex:"Others คิดว่า “new versions bring more people to the original” ข้อ 2 เป็นความเห็นของ traditional chefs (อีกฝ่าย) ซึ่งเป็นตัวลวงที่ดูเหมือนถูก"}
    ]},
  { title:"Passage 2 · Saving our seas", stim:`<h3>Can Fish Farms Save the Ocean?</h3>
<p><span class="pl">1</span>As wild fish populations decline, many people see aquaculture, or fish farming, as the answer. Since 1990, global production from fish farms has grown more than fivefold, and farms now supply about half of all the fish that people eat. Supporters argue that by raising fish in tanks or ocean pens, we can reduce the pressure on wild species.</p>
<p><span class="pl">2</span>However, fish farming is not as simple as it seems. Many popular farmed species, such as salmon, are predators. To grow, they must be fed fishmeal made from small wild fish like anchovies and sardines. In the past, it could take several kilograms of wild fish to produce a single kilogram of farmed salmon. In other words, some farms were actually increasing the number of wild fish taken from the sea.</p>
<p><span class="pl">3</span>Farms can also harm the environment around them. When thousands of fish are kept in a small space, waste and uneaten food collect under the pens and can pollute the water. Diseases and parasites spread easily in crowded conditions and sometimes pass to wild fish swimming nearby.</p>
<p><span class="pl">4</span>Fortunately, the industry is changing. Many farms now use feed made partly from plants or insects, and species that eat mainly plants, such as tilapia and carp, need little or no fishmeal at all. Scientists are also developing closed systems on land that keep farm waste out of the ocean. Aquaculture, it seems, can help save our seas, but only if it is done carefully.</p>`,
    qs:[
    {t:"R", q:"Which sentence best states the main idea of the passage?", opts:["Fish farming can help wild fish, but only if its problems are managed.","Fish farming has already solved the global problem of overfishing.","Fish farms should be closed because they always pollute the ocean.","Farmed salmon is now healthier to eat than wild-caught salmon."], ex:"ประโยคสุดท้าย “can help save our seas, but only if it is done carefully” คือใจความหลัก ตัวลวงข้อ 2 และ 3 สุดโต่งเกินไป (already solved / always pollute)"},
    {t:"R", q:"According to paragraph 2, how can salmon farming increase the pressure on wild fish?", opts:["Farmed salmon are fed with fishmeal made from small wild fish.","Farmed salmon escape and compete with wild fish for their food.","Salmon farms are often built in places where wild fish breed.","Farmed salmon spread diseases that kill many small wild fish."], ex:"ย่อหน้า 2 พูดถึงอาหาร fishmeal จากปลาเล็กในธรรมชาติ ข้อ 4 เป็นเรื่องโรคซึ่งอยู่ย่อหน้า 3 และบทความไม่ได้บอกว่าโรคฆ่าปลาเล็ก จึงไม่ใช่คำตอบของย่อหน้า 2"},
    {t:"R", q:"In paragraph 2, the phrase “In other words” introduces ___.", opts:["a restatement of the previous idea in simpler terms","a new example that supports a completely different idea","a contrast with the information that came just before","a prediction about the future of the fish-farming industry"], ex:"<b>In other words</b> = กล่าวอีกนัยหนึ่ง ใช้สรุปความเดิมให้ชัดขึ้น ไม่ใช่ขัดแย้ง (however) หรือคาดการณ์"},
    {t:"R", q:"What can be inferred about tilapia and carp from paragraph 4?", opts:["Farming them puts less pressure on wild fish than farming salmon.","They are now the most popular farmed fish anywhere in the world.","They can only be raised in closed systems that are built on land.","They never catch diseases, even in very crowded fish farms."], ex:"ปลาเหล่านี้กินพืช ใช้ fishmeal น้อยหรือไม่ใช้ จึงอนุมานได้ว่าใช้ปลาธรรมชาติน้อยกว่าปลาแซลมอน ข้ออื่นบทความไม่ได้กล่าวไว้"},
    {t:"R", q:"Which phrase best describes the writer's attitude toward aquaculture?", opts:["cautiously optimistic","strongly opposed","mostly uninterested","uncritically enthusiastic"], ex:"ผู้เขียนเห็นทั้งปัญหา (ย่อหน้า 2–3) และทางออก (“Fortunately… but only if…”) = มีความหวังแบบระมัดระวัง ไม่ได้ชื่นชมโดยไม่วิจารณ์"}
    ]},
  { title:"Passage 3 · Memory and learning", stim:`<h3>The Forgetting Curve</h3>
<p><span class="pl">1</span>In the 1880s, the German psychologist Hermann Ebbinghaus carried out an unusual experiment on himself. He memorized long lists of meaningless syllables, such as “WID” and “ZOF,” and then tested how many he could recall after different periods of time. Because the syllables had no meaning, he could study memory without any help from his existing knowledge.</p>
<p><span class="pl">2</span>His results were surprising. Much of what he learned disappeared very quickly, often more than half within the first day. After that, the rate of forgetting slowed down. When he showed these results on a graph, the line dropped steeply at first and then became almost flat. This pattern is now known as the “forgetting curve.”</p>
<p><span class="pl">3</span>Ebbinghaus also discovered something more encouraging. Each time he reviewed a list, he forgot it more slowly than before. In addition, reviews that were spread out over several days were more effective than the same number of reviews done all at once. Today, this technique is called spaced repetition, and it forms the basis of many popular language-learning apps.</p>
<p><span class="pl">4</span>Of course, real learning is different from memorizing nonsense syllables. Information that is meaningful, emotional, or connected to things we already know is usually easier to remember. Still, the basic lesson remains: forgetting is a natural process, and the best way to fight it is not to study for hours the night before an exam, but to review a little at a time over a longer period.</p>`,
    qs:[
    {t:"R", q:"Why did Ebbinghaus use meaningless syllables in his experiment?", opts:["so that his existing knowledge would not help him remember","so that the lists would be easier and faster to memorize","because real German words were too difficult to test","because he wanted to invent a new kind of language"], ex:"ย่อหน้า 1: “without any help from his existing knowledge” ตัวลวงข้อ 2 ฟังดูสมเหตุสมผล แต่บทความไม่ได้ให้เหตุผลนี้"},
    {t:"R", q:"Which description best matches the shape of the forgetting curve?", opts:["a sharp drop at first, followed by a much slower decline","a slow, steady drop that continues at the same rate","a sharp rise at first, followed by a long flat period","a steady drop that stops completely after one hour"], ex:"“dropped steeply at first and then became almost flat” = ลดฮวบช่วงแรก แล้วลดช้าลงมาก"},
    {t:"R", q:"The word “encouraging” in paragraph 3 is closest in meaning to ___.", opts:["giving hope or confidence","causing worry or fear","hard to understand fully","surprising but not useful"], ex:"ย่อหน้า 2 เป็นข่าวร้าย (ลืมเร็ว) ย่อหน้า 3 เป็นข่าวดี (ทบทวนแล้วลืมช้าลง) <b>encouraging</b> = ทำให้มีกำลังใจ"},
    {t:"R", q:"According to the passage, which student is using spaced repetition?", opts:["Mai reviews her notes for twenty minutes every day for a week.","Ton studies for six hours straight on the night before his exam.","Nok reads the whole chapter five times in a single afternoon.","Pim writes every new word in her notebook just one time."], ex:"Spaced repetition = ทบทวนกระจายหลายวัน ข้อ Nok ทบทวนหลายครั้งก็จริง แต่ “all at once” ในบ่ายเดียว จึงไม่ใช่"},
    {t:"R", q:"What is the main purpose of paragraph 4?", opts:["to admit a limit of the study and still give practical advice","to argue that Ebbinghaus's experiment was completely useless","to explain why emotional memories are forgotten very easily","to describe how language-learning apps were first developed"], ex:"“Of course, real learning is different…” = ยอมรับข้อจำกัด แล้ว “Still, the basic lesson remains…” = ให้คำแนะนำ ข้อ 3 ผิดเพราะบทความบอกว่าเรื่องที่มีอารมณ์ร่วม “easier to remember”"}
    ]}
  ]
},
{ id:"p3", tab:"Part III", title:"Part III · Writing and Language for Writing", sub:"Main idea and details, present perfect, simple past, chart language, by + gerund, cause and effect. (30 items)",
  groups:[
  { title:"Main idea and details", stim:`<p class="note">Read the paragraph. Then answer items 31–34.</p>
<p>(1) In recent years, K-dramas have become popular far beyond South Korea. (2) Streaming services have made it easy for viewers around the world to watch them with subtitles in dozens of languages. (3) Many fans also say the stories feel fresh because they focus on family relationships and slow-building romance. (4) Korean films have also won major international awards, including the Oscar for Best Picture. (5) In addition, the global success of <i>Squid Game</i> has encouraged many viewers to try other Korean series. (6) <span style="display:inline-block;min-width:150px;border-bottom:1.5px solid var(--ink)">&nbsp;</span></p>`,
    qs:[
    {t:"M", q:"Which sentence does NOT belong in the paragraph?", fixed:true, a:2, opts:["Sentence (2)","Sentence (3)","Sentence (4)","Sentence (5)"], ex:"ย่อหน้านี้พูดถึง <b>K-dramas</b> (ละครชุด) ประโยค (4) พูดถึงภาพยนตร์เกาหลี แม้เป็นเรื่อง Korean Wave เหมือนกัน แต่ไม่สนับสนุน topic sentence นี้"},
    {t:"M", q:"Which sentence would be the best concluding sentence (6) that restates the main idea?", opts:["In short, technology and fresh stories have helped K-dramas win fans worldwide.","In short, K-dramas will soon be more popular than any Hollywood TV series.","In short, <i>Squid Game</i> is the most successful K-drama that has ever been made.","In short, everyone should watch K-dramas with subtitles in their own language."], ex:"ข้อแรกสรุปเหตุผลทั้งหมด (streaming + เนื้อเรื่อง) ข้อ 2 เป็นการคาดการณ์ ข้อ 3 เป็นเพียงรายละเอียดเดียว ข้อ 4 เป็นความเห็นใหม่ แม้ขึ้นต้นด้วย In short ก็ไม่ได้ restate"},
    {t:"M", q:"Which concluding sentence makes a prediction?", opts:["K-dramas are likely to keep attracting new international viewers.","I believe that K-dramas are more interesting than most Western shows.","Why do you think K-dramas have become so popular in other countries?","To sum up, K-dramas have found a large and loyal global audience."], ex:"“are likely to keep…” = คาดการณ์อนาคต ข้อ 2 = opinion ข้อ 3 = question ข้อ 4 = restates the main idea"},
    {t:"M", q:"What is the function of sentence (1)?", opts:["It states the main idea that the other sentences support.","It gives a specific example that supports the main idea.","It summarizes the details that were mentioned before it.","It introduces a second idea that differs from the first one."], ex:"ประโยค (1) คือ topic sentence บอกใจความหลัก ส่วน (2), (3), (5) เป็น supporting sentences"}
    ]},
  { title:"Topic, supporting and concluding sentences",
    qs:[
    {t:"M", q:"A student is writing a paragraph that explains a graph. Which is the most effective topic sentence?", opts:["The graph shows that global fish farming rose sharply between 1990 and 2020.","This paragraph is going to talk about a graph that shows fish farming data.","Fish farming is a very interesting topic that many people care about today.","In 2020, fish farms around the world produced about 87 million metric tons."], ex:"ตาม Writing Skill Unit 4: บอกว่ากราฟแสดงอะไร + แนวโน้มหลัก ข้อ 4 เป็นแค่ detail (ตัวเลขปีเดียว) ข้อ 2 และ 3 กว้างและไม่บอกแนวโน้ม"},
    {t:"M", q:"Topic sentence: “Sleep plays an important role in forming memories.” Which sentence would NOT be a good supporting sentence?", opts:["Many people find it difficult to fall asleep when the weather is hot.","During deep sleep, the brain moves new information into long-term memory.","Students who sleep after studying usually recall more facts the next day.","Losing even one night of sleep can make it harder to learn new information."], ex:"ข้อแรกพูดเรื่องการนอน แต่ไม่เกี่ยวกับ “memory” จึงไม่สนับสนุน topic sentence ตัวลวงนี้เข้าใจผิดได้ง่ายเพราะมีคำว่า sleep"},
    {t:"M", q:"A paragraph explains three ways social media helps small businesses. It ends: “In conclusion, social media also has many disadvantages.” What is the problem?", opts:["It introduces a new idea instead of concluding the paragraph.","It uses a phrase that cannot begin a concluding sentence.","It makes a prediction instead of restating the main idea.","It asks a question that the reader is not able to answer."], ex:"Concluding sentence ไม่ควรเปิดประเด็นใหม่ (ข้อเสีย) ที่ย่อหน้าไม่ได้พูดถึง “In conclusion” ใช้ขึ้นต้นได้ และประโยคนี้ไม่ใช่การคาดการณ์หรือคำถาม"}
    ]},
  { title:"Using the present perfect tense",
    qs:[
    {t:"PP", q:"Since the documentary was released, the number of visitors to the reef ___ significantly.", opts:["has increased","increased","had increased","is increasing"], ex:"ประโยคหลักที่มี since + clause ต้องใช้ present perfect → <b>has increased</b> (ประธาน the number ใช้ has) ส่วน clause หลัง since ใช้ simple past (was released) ถูกแล้ว"},
    {t:"PP", q:"Over 40 million people ___ members of BTS's ARMY since the band first appeared in 2013.", opts:["have become","became","has become","were becoming"], ex:"since 2013 → present perfect; ประธาน 40 million people เป็นพหูพจน์ → <b>have become</b> (ตัวอย่างจากหนังสือ Unit 3)"},
    {t:"PP", q:"Which sentence uses the present perfect correctly?", opts:["Scientists have studied coral bleaching for more than thirty years.","Scientists have studied coral bleaching for the first time in 1998.","Scientists have been study coral bleaching since many years ago.","Scientists has studied coral bleaching closely since the 1990s."], ex:"ข้อ 2 มีปีที่จบแล้ว (in 1998) ใช้ present perfect ไม่ได้ ข้อ 3 ผิดรูป (been study) ข้อ 4 ประธานพหูพจน์ต้องใช้ have"},
    {t:"PP", q:"A: “How long ___ English?” B: “I started when I was seven, and I'm still learning.”", opts:["have you studied","did you study","are you studying","have you study"], ex:"เริ่มในอดีตและยังทำอยู่ → <b>How long have you studied…?</b> ส่วน did you study ใช้เมื่อเลิกเรียนไปแล้ว"},

const TOPIC_NAMES = {V:"Vocabulary",R:"Reading comprehension",M:"Main idea & details",PP:"Present perfect",SP:"Simple past",C:"Charts & graphs",BG:"By + gerund",CE:"Cause & effect"};

/* ---------- STATE ---------- */
const KEY="rw-final-2569-v1";
let ALL=[]; const SETS={A:SET_A,B:SET_B}; const SET_NAMES={A:"Set A · Standard",B:"Set B · Challenge",M:"Set C · Mixed"};
/* Mixed set: same 60-item blueprint, each slot drawn from Set A or Set B.
   A group that carries a stimulus (passage or graph) is taken whole, so its questions keep their text. */
function buildMixed(seed){
  const r=rng((seed|0)*7919+13);
  return SET_A.map((pa,pi)=>{
    const pb=SET_B[pi];
    return Object.assign({},pa,{groups:pa.groups.map((ga,gi)=>{
      const gb=pb.groups[gi];
      if(ga.stim||gb.stim) return r()<.5?gb:ga;
      return Object.assign({},ga,{qs:ga.qs.map((qa,qi)=>r()<.5?gb.qs[qi]:qa)});
    })});
  });
}
let S = {stage:"cover", set:"A", name:"", mode:"exam", seed:0, answers:{}, part:0, endAt:null, submitted:false};
function useSet(k){EXAM = k==="M" ? buildMixed(S.seed) : (SETS[k]||SET_A); ALL=[]; EXAM.forEach((p,pi)=>p.groups.forEach(g=>g.qs.forEach(q=>{q.n=ALL.length+1;q.part=pi;ALL.push(q)})));}
useSet("A");
function load(){try{const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){} return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let saved = load();

function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function order(q){ // display order of option indexes
  const idx=q.opts.map((_,i)=>i); if(q.fixed) return idx;
  const r=rng(S.seed*1000+q.n); for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]} return idx;
}
const keyOf=q=>q.fixed?q.a:0;
const isLocked=q=>S.submitted || (S.mode==="practice" && S.answers[q.n]!==undefined);

/* ---------- RENDER ---------- */
const app=document.getElementById("app");
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

    <form class="start" id="startForm">

  </aside></section>`;
  $("#startForm").addEventListener("submit",e=>{e.preventDefault();
    S={stage:"test",set:document.querySelector('input[name=set]:checked').value,name:$("#nm").value.trim(),mode:document.querySelector('input[name=mode]:checked').value,seed:Math.floor(Math.random()*1e6),answers:{},part:0,submitted:false,endAt:null};
    if(S.mode==="exam") S.endAt=Date.now()+120*60*1000;
    useSet(S.set); save(); go();});
  const rb=$("#resumeBtn"); if(rb) rb.addEventListener("click",()=>{S=saved; useSet(S.set||"A"); go();});

function qHTML(q){
  const ord=order(q), ans=S.answers[q.n], locked=isLocked(q), key=keyOf(q);
  const showKey = locked;
  const cls = showKey ? (ans===key?"is-right":"is-wrong") : "";
  const opts = ord.map((oi,pos)=>{
    let c="opt"; if(showKey){ if(oi===key) c+=" key"; else if(ans===oi) c+=" miss"; }
    return `<label class="${c}"><input type="radio" name="q${q.n}" id="q${q.n}o${oi}" value="${oi}" ${ans===oi?"checked":""} ${locked?"disabled":""}><span class="l">${"ABCD"[pos]}</span><span>${q.opts[oi]}</span></label>`}).join("");
  const ex = showKey ? `<div class="ex"><b>${ans===key?"Correct":(ans===undefined?"Not answered":"Answer: "+"ABCD"[ord.indexOf(key)])}</b> — ${q.ex}</div>` : "";
  return `<article class="q ${cls} ${locked?"locked":""}" id="q-${q.n}"><div class="q-top"><span class="qn">${q.n}.</span><div class="qt">${q.q.replace(/___/g,'<span class="gap"></span>')}</div></div><div class="opts">${opts}</div>${ex}</article>`;
}

function renderTest(){
  const p=EXAM[S.part];
  const tabs=EXAM.map((pp,i)=>{const qs=ALL.filter(q=>q.part===i);const d=qs.filter(q=>S.answers[q.n]!==undefined).length;
    return `<button class="tab" role="tab" aria-selected="${i===S.part}" data-part="${i}">${pp.tab}<small>${d}/${qs.length}</small></button>`}).join("");
  const cells=ALL.map(q=>{let c="cell"; const a=S.answers[q.n];
    if(isLocked(q)) c+= a===keyOf(q)?" right":" wrong"; else if(a!==undefined) c+=" done";
    return `<button class="${c}" data-jump="${q.n}" aria-label="Question ${q.n}">${q.n}</button>`}).join("");
  const groups=p.groups.map(g=>{
    const qs=`<div class="qs">${g.qs.map(qHTML).join("")}</div>`;
    const body = g.stim ? (S.part===1||g.stim.length>600 ? `<div class="split"><div class="stim">${g.stim}</div>${qs}</div>` : `<div class="stim" style="margin-bottom:12px">${g.stim}</div>${qs}`) : qs;
    return `<section class="group"><h3 class="group-title">${g.title}</h3>${body}</section>`}).join("");
  const resultBlock = S.submitted ? resultHTML() : "";
  app.innerHTML = `${resultBlock}<nav class="tabs" role="tablist">${tabs}</nav>
  <details class="palette" id="pal"><summary>ตารางข้อสอบ · กดเลขข้อเพื่อไปยังข้อนั้น</summary><div class="cells">${cells}</div></details>
  <div class="part-head"><h2>${p.title}</h2><p>${p.sub}</p></div>
  ${groups}
  <div class="navrow">
    ${S.part>0?`<button class="btn" data-part="${S.part-1}">← ${EXAM[S.part-1].tab}</button>`:"<span></span>"}
    ${S.part<EXAM.length-1?`<button class="btn primary" data-part="${S.part+1}">${EXAM[S.part+1].tab} →</button>`:(S.submitted?`<button class="btn primary" id="againBtn2">Take a new attempt</button>`:`<button class="btn primary" id="finishBtn">Finish and submit</button>`)}
  </div>`;
  bindTest();
}

function resultHTML(){
  const right=ALL.filter(q=>S.answers[q.n]===keyOf(q)).length;
  const per=EXAM.map((p,i)=>{const qs=ALL.filter(q=>q.part===i);return [p.tab+" · "+p.title.split("· ")[1], qs.filter(q=>S.answers[q.n]===keyOf(q)).length, qs.length]});
  const topics=Object.keys(TOPIC_NAMES).map(t=>{const qs=ALL.filter(q=>q.t===t);return [TOPIC_NAMES[t],qs.filter(q=>S.answers[q.n]===keyOf(q)).length,qs.length]});
  const bar=([n,r,t])=>`<div class="brow"><span>${n}</span><span class="track"><i class="${r/t<.6?"weak":""}" style="width:${(r/t*100).toFixed(0)}%"></i></span><b>${r}/${t}</b></div>`;
  const weak=topics.filter(([,r,t])=>r/t<.6).map(x=>x[0]);
  return `<section class="result">
  <div class="score-card">
    <div><div class="eyebrow">${S.name?esc(S.name)+" · ":""}${SET_NAMES[S.set||"A"]} · Your score</div><div class="big">${right}<small> / 60</small></div><div class="pct">${(right/60*100).toFixed(1)}%</div></div>
    <div class="bars">${per.map(bar).join("")}<div style="height:6px"></div>${topics.map(bar).join("")}</div>
  </div>
  <p class="tip">${weak.length?"ควรทบทวนเพิ่ม: "+weak.join(", ")+" (แถบสีแดง = ถูกน้อยกว่า 60%)":"ทำได้ดีทุกหัวข้อ ลองทำใหม่อีกรอบด้วยลำดับตัวเลือกใหม่"}. เลื่อนลงเพื่อดูเฉลยและคำอธิบายรายข้อ</p>
  <div class="result-actions"><button class="btn primary" id="againBtn">Take a new attempt</button><button class="btn" id="firstWrong">Go to first wrong answer</button></div>
  </section>`;
}

function bindTest(){
  app.querySelectorAll("[data-part]").forEach(b=>b.addEventListener("click",()=>{S.part=+b.dataset.part;save();renderTest();window.scrollTo({top:0});}));
  app.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{const n=+b.dataset.jump;const q=ALL[n-1];
    if(q.part!==S.part){S.part=q.part;save();renderTest();$("#pal").open=true}
    document.getElementById("q-"+n).scrollIntoView({block:"start"})}));
  app.querySelectorAll('.q input[type=radio]').forEach(inp=>inp.addEventListener("change",()=>{
    const n=+inp.name.slice(1); S.answers[n]=+inp.value; save();
    const q=ALL[n-1]; const art=document.getElementById("q-"+n);
    const pal=$("#pal")?.open;
    if(S.mode==="practice"){ art.outerHTML=qHTML(q); renderTestKeepScroll(pal); } else { updateChrome(); refreshPaletteAndTabs(); }
  }));
  const f=$("#finishBtn"); if(f) f.addEventListener("click",confirmSubmit);
  ["#againBtn","#againBtn2"].forEach(id=>{const a=$(id); if(a) a.addEventListener("click",()=>{S.stage="cover";S.submitted=false;S.answers={};save();go();window.scrollTo({top:0});})});
  const fw=$("#firstWrong"); if(fw) fw.addEventListener("click",()=>{const q=ALL.find(q=>S.answers[q.n]!==keyOf(q)); if(!q) return; if(q.part!==S.part){S.part=q.part;save();renderTest();} document.getElementById("q-"+q.n).scrollIntoView({block:"start"})});
  updateChrome();
}
function renderTestKeepScroll(palOpen){const y=window.scrollY; renderTest(); if(palOpen) $("#pal").open=true; window.scrollTo({top:y});}
function refreshPaletteAndTabs(){
  app.querySelectorAll(".cell").forEach(c=>{const n=+c.dataset.jump;c.classList.toggle("done",S.answers[n]!==undefined)});
  app.querySelectorAll(".tab").forEach(t=>{const i=+t.dataset.part;const qs=ALL.filter(q=>q.part===i);t.querySelector("small").textContent=qs.filter(q=>S.answers[q.n]!==undefined).length+"/"+qs.length});
}

function updateChrome(){
  const n=Object.keys(S.answers).length;
  $("#answeredStat").textContent = S.submitted ? "Submitted" : `${n}/60 answered`;
  $("#progressBar").style.width=(n/60*100)+"%";
  $("#setTag").textContent = S.stage==="test" ? "· "+SET_NAMES[S.set||"A"] : "";
  const sb=$("#submitBtn"); sb.hidden = !(S.stage==="test" && !S.submitted);
  $("#cancelBtn").hidden = sb.hidden;
  $("#timer").hidden = !(S.stage==="test" && S.mode==="exam" && !S.submitted && S.endAt);
}

function confirmSubmit(){
  const left=60-Object.keys(S.answers).length;
  const ov=document.createElement("div"); ov.className="sheet-overlay";
  ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">Submit your answers?</h3><p>${left?`ยังไม่ได้ตอบอีก ${left} ข้อ ข้อที่ไม่ได้ตอบจะนับเป็นผิด`:"ตอบครบทั้ง 60 ข้อแล้ว"} เมื่อส่งแล้วจะแก้คำตอบไม่ได้</p><div class="row"><button class="btn" id="dlgNo">Keep working</button><button class="btn primary" id="dlgYes">Submit</button></div></div>`;
  document.body.appendChild(ov); $("#dlgYes").focus();
  $("#dlgNo").onclick=()=>ov.remove(); ov.addEventListener("click",e=>{if(e.target===ov) ov.remove()});
  $("#dlgYes").onclick=()=>{ov.remove(); doSubmit();};
}
function doSubmit(){S.submitted=true;S.part=0;save();renderTest();window.scrollTo({top:0});}

function confirmCancel(){
  const n=Object.keys(S.answers).length;
  const ov=document.createElement("div"); ov.className="sheet-overlay";
  ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="canT"><h3 id="canT">ยกเลิกการสอบ?</h3><p>${n?`คำตอบ ${n} ข้อที่ทำไว้จะถูกลบทั้งหมด`:"ยังไม่ได้ตอบข้อใดเลย"} และกลับไปหน้าแรกโดยไม่บันทึกคะแนน</p><div class="row"><button class="btn" id="canNo">ทำข้อสอบต่อ</button><button class="btn danger" id="canYes">ยกเลิกสอบ</button></div></div>`;
  document.body.appendChild(ov); $("#canNo").focus();
  const close=()=>{ov.remove();document.removeEventListener("keydown",esckey)};
  function esckey(e){if(e.key==="Escape")close()}
  document.addEventListener("keydown",esckey);
  $("#canNo").onclick=close; ov.addEventListener("click",e=>{if(e.target===ov) close()});
  $("#canYes").onclick=()=>{close(); doCancel();};
}
function doCancel(){
  try{localStorage.removeItem(KEY)}catch(e){}
  saved=null;
  S={stage:"cover",set:S.set,name:S.name,mode:S.mode,seed:0,answers:{},part:0,endAt:null,submitted:false};
  useSet(S.set); go(); window.scrollTo({top:0});
}

/* timer */
setInterval(()=>{
  if(S.stage!=="test"||S.mode!=="exam"||S.submitted||!S.endAt) return;
  const ms=S.endAt-Date.now(), t=$("#timer");
  if(ms<=0){ t.textContent="00:00"; doSubmit(); return; }
  const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000);
  t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("low", ms<10*60000);
},500);

$("#submitBtn").addEventListener("click",confirmSubmit);
$("#cancelBtn").addEventListener("click",confirmCancel);
function go(){ if(S.stage==="cover") renderCover(); else renderTest(); updateChrome(); }
if(saved && saved.submitted){ S=saved; useSet(S.set||"A"); }
go();
</script>

</body></html>
